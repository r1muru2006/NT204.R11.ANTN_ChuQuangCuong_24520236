[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nt204-ids"
version = "0.2.0"
description = "Intrusion Detection System: packet capture, parser, decoder, preprocessor and flow tracker"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scapy>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
ids-pipeline = "ids.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
